<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>와파 번호</title>
<meta name="theme-color" content="#0F6E68">
<link rel="stylesheet" href="wafa.css?v=20261120c">
<script src="alias_config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="alias_common.js?v=20261121c"></script>
<script src="wafa.js?v=20261121c"></script>
</head>
<body>
<!-- 와파 번호 — 내 번호 · 무료 번호 받기 · 좋은 번호 사기 · 고르기권 · 생각해 둔 번호 · 가족 번호
     번호 상태 · 등급 · 가격은 모두 서버(wafa_*)가 정합니다. 화면은 보여 주기만 합니다. -->
<div class="wf">
  <div class="wf-top"></div>
  <div class="card" id="mineCard"><h2 data-w="mine"></h2><div id="mine" class="list" style="display:flex;flex-direction:column;gap:8px"></div><p class="msg" id="mineMsg"></p></div>
  <div class="tabs" id="tabs"></div>
  <p class="muted" id="rule"></p>
  <div id="list" style="display:flex;flex-direction:column;gap:8px"></div>
  <button class="btn ghost" id="more" data-w="more"></button>

  <div class="card"><h2 data-w="findT"></h2>
    <div class="row"><input id="q" inputmode="numeric" maxlength="13" placeholder="4829 051 318"><button class="btn small" id="qGo" data-w="find"></button></div>
    <div id="qOut" style="display:flex;flex-direction:column;gap:8px"></div></div>

  <div class="card"><h2 data-w="famT"></h2><p class="muted" data-w="famD"></p>
    <div class="row"><select id="fPos"><option value="mid" data-w="famMid"></option><option value="last" data-w="famLast"></option></select>
      <input id="fPart" inputmode="numeric" maxlength="3" placeholder="051">
      <select id="fCnt"><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option></select>
      <button class="btn small" id="fGo" data-w="find"></button></div>
    <div id="fOut" style="display:flex;flex-direction:column;gap:8px"></div><p class="msg" id="fMsg"></p></div>

  <div class="card"><h2 data-w="famCodeT"></h2>
    <div class="row"><input id="code" maxlength="10" placeholder="A1B2C3D4" style="text-transform:uppercase"><button class="btn small" id="codeGo" data-w="famCodeGo"></button></div>
    <p class="msg" id="codeMsg"></p></div>

  <div class="card" id="holdCard" hidden><h2 data-w="holds"></h2><div id="holds" style="display:flex;flex-direction:column;gap:8px"></div></div>
</div>
<script>
(async function(){
  WF.header(WF.t('numTitle'), 'wafa_start.html');
  WF.paint();
  var sess = await AL.requireLogin(); if (!sess) return;
  var me = await WF.me();
  var G = 'N';
  var active = !!(me.quota && me.quota.active);
  var canFree = active && !me.free_used;
  var credit = function(g){ return (me.credits || []).find(function(c){ return c.kind === (g === 'N' ? 'extra' : g); }); };

  function drawMine(){
    var M = document.getElementById('mine');
    M.innerHTML = (me.numbers || []).map(function(n){
      return '<div class="num"><div class="no">' + WF.shown(n.number) + WF.badge(n.grade) + '<small>' + WF.t('kind_' + n.kind) +
        (n.main ? ' · ' + WF.t('mainTag') : '') + '</small></div></div>'; }).join('') || '<p class="muted">' + WF.t('noNumber') + '</p>';
    var msg = [], goSub = false;
    if (canFree) msg.push(WF.t('freeReady')); else if (!me.free_used) { msg.push(WF.t('needPlanFree')); goSub = true; }
    if ((me.credits || []).length) msg.push(WF.t('credits', { n: me.credits.length }));
    /* 🔴 2026-11-20 구독 전이면 바로 옆에 [구독하러 가기] */
    document.getElementById('mineMsg').innerHTML = WF.esc(msg.join(' ')) +
      (goSub ? ' <a class="btn small" href="wafa_plan.html" style="display:inline-grid;place-items:center;text-decoration:none;margin-top:8px">' + WF.esc(WF.t('goSub')) + '</a>' : '');
    var H = me.holds || [];
    document.getElementById('holdCard').hidden = !H.length;
    document.getElementById('holds').innerHTML = H.map(function(h){
      return '<div class="num"><div class="no">' + WF.shown(h.number) + '<small>' + (h.kind === 'family' ? WF.t('famT') + ' · ' : '') +
        WF.date(h.until) + '</small></div>' + (h.kind === 'family' ? '<span class="code" data-copy="' + WF.esc(h.code) + '">' + WF.esc(h.code) + '</span>' : '') + '</div>'; }).join('');
  }

  function action(x){      // x = { number, grade, status }
    if (x.status === 'company') return '<span class="soldtag">SOLD OUT</span>';
    if (x.status !== 'free' && x.status !== 'held_mine') return '';
    if (x.grade === 'N' && canFree) return '<button class="btn small" data-act="free" data-n="' + x.number + '">' + WF.t('getFree') + '</button>';
    if (credit(x.grade)) return '<button class="btn small" data-act="credit" data-n="' + x.number + '" data-g="' + x.grade + '">' + WF.t('useCredit') + '</button>';
    if (x.grade === 'N' && !(me.numbers || []).length) return '';                 // 첫 번호는 구독 뒤 무료로
    return '<button class="btn small" data-act="buy" data-n="' + x.number + '" data-g="' + x.grade + '">' + WF.t('buy') + '</button>';
  }
  function row(x){
    return '<div class="num' + (x.status === 'company' ? ' sold' : '') + '"><div class="no">' + WF.shown(x.number) + WF.badge(x.grade) +
      '<small>' + (x.grade === 'N' ? (canFree ? WF.t('free') : WF.krw(3300)) : WF.price(x.grade)) + '</small></div>' + action(x) + '</div>';
  }

  var tabs = document.getElementById('tabs');
  tabs.innerHTML = [['N','tabN'],['3','tab3'],['4','tab4'],['5','tab5']].map(function(a){
    return '<button data-g="' + a[0] + '"' + (a[0] === G ? ' class="on"' : '') + '>' + WF.t(a[1]) + '</button>'; }).join('');
  async function load(add){
    document.getElementById('rule').textContent = WF.t('r' + G);
    var out = await WF.rpc('wafa_number_shop', { p_grade: G, p_limit: 10 });
    var L = document.getElementById('list');
    L.innerHTML = (add ? L.innerHTML : '') + (out.items || []).map(row).join('');
  }
  tabs.onclick = function(e){ var b = e.target.closest('button'); if (!b) return; G = b.dataset.g;
    tabs.querySelectorAll('button').forEach(function(x){ x.classList.toggle('on', x === b); }); load(false); };
  document.getElementById('more').onclick = function(){ load(true); };

  /* 고르기 · 사기 */
  document.addEventListener('click', async function(e){
    var cp = e.target.closest('[data-copy]');
    if (cp) { try { await navigator.clipboard.writeText(cp.dataset.copy); WF.toast(WF.t('copied')); } catch (err) {} return; }
    var b = e.target.closest('[data-act]'); if (!b) return;
    b.disabled = true;
    try {
      var r;
      if (b.dataset.act === 'free') r = await WF.rpc('wafa_claim_free', { p_number: b.dataset.n });
      else if (b.dataset.act === 'credit') r = await WF.rpc('wafa_use_credit', { p_credit: credit(b.dataset.g).id, p_number: b.dataset.n });
      else {
        r = await WF.rpc('wafa_checkout_hold', { p_number: b.dataset.n, p_kind: b.dataset.g === 'N' ? 'extra' : b.dataset.g });
        if (r && r.ok) {
          WF.onDone = function(o){ WF.toast(o.ok ? WF.t('payOk') : o.canceled ? WF.t('payCancel') : o.pending ? WF.t('payPending') : WF.t('payFail'));
                                   if (o.ok) setTimeout(function(){ location.reload(); }, 900); };
          WF.toast(WF.t('paying'));
          if (!WF.buy(r.sku)) b.disabled = false;
          return;
        }
      }
      if (r && r.ok) { location.reload(); return; }
      WF.toast((r && WF.t('st_' + r.error)) || WF.t('err'));
    } catch (err) { WF.toast(WF.t('err')); }
    b.disabled = false;
  });

  /* 생각해 둔 번호 */
  document.getElementById('qGo').onclick = async function(){
    var n = document.getElementById('q').value.replace(/\D/g, ''), O = document.getElementById('qOut');
    if (!/^[1-9]\d{9}$/.test(n)) { O.innerHTML = '<p class="msg bad">' + WF.t('badNum') + '</p>'; return; }
    var r = await WF.rpc('wafa_number_info', { p_number: n });
    if (!r.ok) { O.innerHTML = '<p class="msg bad">' + WF.t('badNum') + '</p>'; return; }
    O.innerHTML = row(r) + '<p class="msg ' + (r.status === 'free' || r.status === 'held_mine' ? 'ok' : 'bad') + '">' + WF.t('st_' + r.status) + '</p>';
  };

  /* 가족 번호 */
  document.getElementById('fGo').onclick = async function(){
    var p = document.getElementById('fPart').value.replace(/\D/g, ''), F = document.getElementById('fOut'), M = document.getElementById('fMsg');
    if (p.length !== 3) { M.className = 'msg bad'; M.textContent = WF.t('famBad'); F.innerHTML = ''; return; }
    var r = await WF.rpc('wafa_family_find', { p_part: p, p_pos: document.getElementById('fPos').value, p_count: +document.getElementById('fCnt').value });
    var items = r.items || [];
    F.innerHTML = items.map(function(x){ return '<div class="num"><div class="no">' + WF.shown(x.number) + WF.badge(x.grade) +
      '<small>' + (x.grade === 'N' ? WF.t('free') : WF.price(x.grade)) + '</small></div></div>'; }).join('') +
      (items.length ? '<button class="btn" id="fHold">' + WF.t('famHold') + '</button>' : '');
    M.textContent = '';
    var h = document.getElementById('fHold');
    if (h) h.onclick = async function(){
      h.disabled = true;
      var o = await WF.rpc('wafa_family_hold', { p_numbers: items.map(function(x){ return x.number; }) });
      if (!o.ok) { M.className = 'msg bad'; M.textContent = WF.t('err'); h.disabled = false; return; }
      M.className = 'msg ok'; M.textContent = WF.t('famDone');
      me = await WF.me(); drawMine();
    };
  };
  document.getElementById('codeGo').onclick = async function(){
    var c = document.getElementById('code').value.trim().toUpperCase(), M = document.getElementById('codeMsg');
    var r = await WF.rpc('wafa_claim_family', { p_code: c });
    if (r.ok && r.pay) {
      WF.onDone = function(o){ if (o.ok) location.reload(); else WF.toast(o.canceled ? WF.t('payCancel') : WF.t('payFail')); };
      WF.buy(r.sku); return;
    }
    if (r.ok) { location.reload(); return; }
    M.className = 'msg bad';
    if (r.error === 'need_plan') M.innerHTML = WF.esc(WF.t('needPlanFree')) + ' <a href="wafa_plan.html" style="font-weight:800;color:var(--brand)">' + WF.esc(WF.t('goSub')) + '</a>';
    else M.textContent = WF.t('err');
  };

  drawMine();
  load(false);
})();
WF.legal(document.querySelector('.wf'));
</script>
</body>
</html>
