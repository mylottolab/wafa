<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>와파 전화</title>
<meta name="theme-color" content="#0F6E68">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<style>
/* 와파 전화 — 앱을 열면 [번호판] [연락처] 두 화면이 바로 (2026-11-20)
   번호판 판 안의 순서: 모양 · 소리 → 누른 번호(오른쪽 ⌫) → 번호판 → 음성 · 영상 · 문자. 112 · 119 안내는 판 밖 맨 아래 */
:root{ --panel:#E4DED0; --panel-line:#D3CBB9; --call:#1E9E5A; --video:#2F6FB8; --text:#8FE3B0; --text-ink:#0E1621 }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --panel:#0A0E12; --panel-line:#26303A; --call:#2FBF73; --video:#3D7FD0 } }
:root[data-theme="dark"]{ --panel:#0A0E12; --panel-line:#26303A; --call:#2FBF73; --video:#3D7FD0 }
html,body{height:100%}
.app{max-width:480px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;
  padding:calc(8px + env(safe-area-inset-top,0px)) 0 env(safe-area-inset-bottom,0px)}
.px{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:10px;min-height:46px}
.mine{flex:1;min-width:0;text-align:right;font-size:12px;color:var(--sub);line-height:1.3}
.mine b{display:block;font:700 15px/1.3 "SF Mono","Roboto Mono",ui-monospace,monospace;color:var(--ink);letter-spacing:.02em;white-space:nowrap}
.mine span{white-space:nowrap}
/* 번호가 없을 때 위쪽에 [내 번호 받기] */
#themeHost{margin-left:auto;display:flex}
.getnum{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:8px;background:var(--brand);color:var(--brand-ink);border-radius:16px;padding:12px 14px;text-decoration:none;text-align:center}
.getnum b{font-size:17px}.getnum span{font-size:12.5px;opacity:.85}
.strip{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);padding:6px 12px;background:var(--soft);border-radius:12px;margin-top:4px}
.strip .dot{width:8px;height:8px;border-radius:50%;background:var(--call);flex:0 0 auto}
.strip.off .dot{background:var(--warn)}
.ptabs{display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--chip);border-radius:14px;padding:4px;margin-top:10px}
.ptabs button{border:0;background:none;color:var(--sub);font:inherit;font-weight:800;padding:9px 0;border-radius:11px;cursor:pointer}
.ptabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.pages{flex:1;min-height:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin-top:8px}
.pages::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;scroll-snap-align:start;min-width:0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:10px;padding-bottom:12px}
.panel{background:var(--panel);border:1px solid var(--panel-line);border-radius:24px;padding:4px 12px 16px;display:flex;flex-direction:column;gap:10px}
.disp{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px 8px 8px 14px}
.disp .no{flex:1;min-width:0;font:700 clamp(24px,7.6vw,32px)/1.2 "SF Mono","Roboto Mono",ui-monospace,monospace;letter-spacing:.03em;white-space:nowrap;overflow:hidden;min-height:40px}
.disp .del{flex:0 0 auto;width:56px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--chip);color:var(--ink);font-size:22px;cursor:pointer}
.who{font-size:13.5px;color:var(--sub);text-align:center;min-height:20px;margin-top:-4px}
.who b{color:var(--brand)} .who.emg{color:var(--warn);font-weight:700}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:330px;width:100%;margin:0 auto}
.keys button{aspect-ratio:1.5;max-width:100%;border:0;border-radius:18px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 1px 0 var(--line);touch-action:manipulation}
.keys button:active{background:var(--soft)}
.keys b{font:600 27px/1 system-ui,sans-serif}
.keys small{font-size:10px;letter-spacing:.14em;color:var(--sub);margin-top:3px;min-height:12px}
/* ⭐ 2026-11-22 단축다이얼 — 숫자 밑에 이름 · 꾸욱 */
.keys small.sd{letter-spacing:0;font-size:11px;font-weight:700;color:var(--brand,#0F6E68);max-width:92%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.keys button.press{background:var(--soft)}
.sdBox{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:4px 0 14px}
.sdBox button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:9px 6px;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.sdBox button b{font-size:18px}.sdBox button span{font-size:12px;color:var(--sub);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sdBox button.on span{color:var(--ink);font-weight:700}
.sdPick{display:flex;flex-direction:column;gap:6px;max-height:46vh;overflow:auto}
.sdPick button{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit;text-align:left;cursor:pointer}
.sdPick button small{color:var(--sub);margin-left:6px}
.sdRow{display:flex;gap:8px}.sdRow input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px;font:inherit}
.ps-round .keys{gap:12px 18px;max-width:300px}.ps-round .keys button{aspect-ratio:1;width:min(78px,100%);justify-self:center;border-radius:50%}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:330px;width:100%;margin:0 auto}
.acts button{min-height:56px;border:0;border-radius:16px;font:inherit;font-weight:800;font-size:16px;cursor:pointer;color:#fff;white-space:nowrap}
.acts .v{background:var(--call)} .acts .vv{background:var(--video)} .acts .m{background:var(--text);color:var(--text-ink)}
.msg{font-size:14px;text-align:center;color:var(--sub);min-height:20px;margin:0}
.msg.bad{color:var(--warn)} .msg a{color:var(--brand);font-weight:800}
.emgbtn{display:block;text-align:center;background:var(--warn);color:#fff;border-radius:14px;padding:12px;font-weight:800;text-decoration:none}
.sos{font-size:12.5px;color:var(--sub);text-align:center;margin:4px 0 0}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:11px 12px;font:inherit}
.search a{border:0;background:var(--brand);color:var(--brand-ink);border-radius:12px;padding:0 14px;font-weight:800;display:grid;place-items:center;text-decoration:none;white-space:nowrap}
.sec{font-size:12px;font-weight:800;color:var(--sub);letter-spacing:.06em;margin:4px 0 -2px}
.list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.ct{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--line)}
.ct:last-child{border-bottom:0}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;font-size:16px;flex:0 0 auto;background:var(--brand);overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.ct .tx{flex:1;min-width:0;cursor:pointer}
.ct .tx b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct .tx span{font-size:13px;color:var(--sub)}
.ct .tx .n{font-family:"SF Mono","Roboto Mono",ui-monospace,monospace}
.tag{font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:4px;background:var(--soft);color:var(--brand)}
.tag.p{background:var(--chip);color:var(--sub)}
.ct .act{display:flex;gap:6px}
.ct .act button{width:40px;height:40px;border-radius:50%;border:0;background:var(--chip);font-size:17px;cursor:pointer}
.ct .act button.c{background:var(--call);color:#fff}
.empty{padding:22px 14px;text-align:center;color:var(--sub);font-size:14px}
.bottom{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--card)}
.bottom a,.bottom button{border:0;background:none;color:var(--sub);font:inherit;font-size:11px;font-weight:700;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;cursor:pointer}
.bottom i{font-style:normal;font-size:20px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet>div{background:var(--card);color:var(--ink);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:20px max(18px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.sheet h3{margin:0;font-size:18px}
.sheet ul{margin:0;padding-left:20px;font-size:14px;color:var(--sub);display:flex;flex-direction:column;gap:6px}
.sheet textarea{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px;font:inherit;min-height:90px}
[hidden]{display:none!important}
/* 📮 음성사서함 */
.vm .tx span{font-family:inherit}
.vm.new .tx b::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);margin-left:6px;vertical-align:middle}
.vm .act button.p{background:var(--brand);color:var(--brand-ink)}
.ptabs .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--warn);color:#fff;font-size:11px;line-height:18px}
/* 🕘 최근 기록 */
.rc .tx b.miss{color:var(--warn)}
.rc .tx .dir{font-weight:800}.rc .tx .dir.miss{color:var(--warn)}
.rc .av{font-size:18px}
.rc .act .t{font-size:12px;color:var(--sub);white-space:nowrap;align-self:center}
/* 🔴 2026-11-21 좁은 폰(아이폰 미니 · SE 등) — 내 번호가 해 · 언어 단추에 가려지지 않게 로고 글자는 빼고 W 만 */
@media (max-width:400px){ .top .wf-logo{font-size:0;gap:0} .top .wf-logo i{font-size:18px} .top{gap:8px} .mine b{font-size:14px} }
/* 🔴 2026-11-21 번호판 판을 촘촘하게 — 모양 · 소리 단추를 한 줄로, 간격은 조금씩 줄여 다이얼 · 음성 · 영상 · 문자가 한 화면에 */
#padBar .ps-bar{flex-wrap:nowrap;gap:4px;margin:8px auto 2px}
#padBar .ps-bar button{padding:6px 8px;font-size:12px}
#padBar .ps-bar:has([data-mix]){flex-wrap:wrap}
html[lang=en] #padBar .ps-bar button{padding:6px 6px;font-size:11.5px}
@media (max-width:360px){ #padBar .ps-bar{flex-wrap:wrap} }
.panel{gap:8px}
.disp{padding:5px 6px 5px 14px}.disp .del{height:44px}
.who{margin-top:-2px}
.page{gap:8px}
.msg:empty{display:none}
.panel{padding-bottom:12px}
.sos{font-size:11.5px;margin-top:0;word-break:keep-all}
/* 키가 작은 폰에서는 다이얼 아래 안내 글(사용법에 있음)과 네모 단추 높이를 줄임 */
@media (max-height:760px){ #panel .ps-rot p{display:none} .keys button{aspect-ratio:1.9} .keys{gap:8px} .acts button{min-height:50px} }
</style>
</head>
<body>
<div class="app">
  <div class="px">
    <div class="top">
      <div class="wf-logo"><i>W</i>WAFA</div>
      <div class="mine" id="mineBox"><span data-d="myNo"></span><b id="myNo">—</b></div>
      <span id="themeHost"></span>
      <div class="wf-lang"><button data-l="ko">한</button><button data-l="en">EN</button></div>
    </div>
    <div class="strip" id="strip"><span class="dot"></span><span id="stripTx"></span></div>
    <a class="getnum" id="getNum" href="wafa_number.html" hidden><b></b><span></span></a>
    <div class="ptabs"><button data-p="0" data-d="tabPad"></button><button data-p="1" data-d="tabRc"></button><button data-p="2" data-d="tabCt"></button></div>
  </div>

  <div class="pages" id="pages">
    <!-- ① 번호판 (번호 전화 · Open Line) -->
    <section class="page px">
      <div class="panel" id="panel">
        <div id="padBar"></div>
        <div class="disp"><span class="no" id="no">&nbsp;</span><button type="button" class="del" id="del" aria-label="delete">⌫</button></div>
        <div class="who" id="who"></div>
        <div id="keys" class="keys"></div>
        <a class="emgbtn" id="emg" href="tel:112" hidden></a>
        <div class="acts" id="acts">
          <button type="button" class="v" data-k="voice"></button>
          <button type="button" class="vv" data-k="video"></button>
          <button type="button" class="m" data-k="chat"></button>
        </div>
        <p class="msg" id="msg"></p>
      </div>
      <p class="sos" data-d="sos"></p>
    </section>

    <!-- ② 최근 기록 (2026-11-21) — 건 · 받은 · 부재중 통화, 최근 것부터. 맨 위 📮 음성사서함 -->
    <section class="page px">
      <div id="vmBox" hidden><div class="sec" data-d="vmT"></div><div class="list" id="vmList"></div></div>
      <div class="sec" data-d="rcT"></div>
      <div class="list" id="rcList"><div class="empty" data-d="loading"></div></div>
    </section>

    <!-- ③ 연락처 -->
    <section class="page px">
      <div class="search"><input id="q" type="search" autocomplete="off"><a href="alias_contacts.html" data-d="private"></a></div>
      <div class="sec" data-d="sdT"></div><p style="margin:-4px 0 8px;font-size:12.5px;color:var(--sub)" data-d="sdSub"></p>
      <div class="sdBox" id="sdBox"></div>
      <div class="sec" data-d="recent"></div>
      <div class="list" id="list"><div class="empty" data-d="loading"></div></div>
    </section>
  </div>

  <nav class="bottom">
    <button id="help"><i>❔</i><span data-d="navHelp"></span></button>
    <a href="wafa_usage.html"><i>📊</i><span data-d="navUsage"></span></a>
    <a href="wafa_plan.html"><i>💳</i><span data-d="navPlan"></span></a>
    <a href="wafa_start.html?home=1"><i>⚙️</i><span data-d="navSet"></span></a>
  </nav>
</div>

<div class="sheet" id="sheet" hidden><div>
  <h3 data-d="helpT"></h3>
  <ul id="helpList"></ul>
  <button class="btn" id="helpOk" data-d="ok"></button>
  <div id="logoutHost"></div>
</div></div>

    fwdTo: ['📲 착신전환 — {n}로 연결합니다', '📲 Forwarded — connecting to {n}'],
    navHelp: ['사용법', 'Help'], navUsage: ['내 사용량', 'My usage'], navPlan: ['요금', 'Plans'], navSet: ['설정', 'Settings'],
    ok: ['알겠어요', 'Got it'], cancel: ['취소', 'Cancel'],
    noteT: ['문자 보내기', 'Send a text'], noteGo: ['보내고 대화 열기', 'Send and open chat'],
    helpT: ['와파 사용법', 'How WAFA works'],
    help: [['와이파이나 핫스팟만 있으면 와파 앱끼리 걸고 받습니다.', '번호판에서 와파 번호 10자리를 누르고 [음성] · [영상] · [문자]를 누르세요.', '⭐ 단축다이얼: 연락처 맨 위 1~9 칸에 사람을 넣어 두면, 번호판에서 그 숫자를 꾸욱 눌러 바로 겁니다.', '번호판 위에서 모양(다이얼 · 네모 · 동그라미 · 섞기)과 소리를 고를 수 있어요.', '별칭 전화(Private Line)는 상대가 수락해야 연결됩니다 — [💬 별칭 전화]에서.', '112 · 119는 휴대폰 기본 전화로 걸어 주세요.'],
           ['With Wi-Fi or a hotspot, WAFA apps call each other.', 'Dial a 10-digit WAFA number, then tap Voice, Video or Text.', '⭐ Speed dial: put people in boxes 1–9 at the top of Contacts, then hold that number on the keypad to call.', 'Above the keypad you can pick a style (rotary, square, round, shuffle) and sounds.', 'Private Line connects after the other side accepts — open Private.', 'For 112 or 119, use your phone’s own dialer.']]
  };
  function d(k, v){ var s = D[k][EN ? 1 : 0]; if (v) for (var x in v) s = s.split('{' + x + '}').join(v[x]); return s; }
  function paintText(){
    document.querySelectorAll('[data-d]').forEach(function(e){ e.textContent = d(e.dataset.d); });
    document.querySelectorAll('#acts [data-k]').forEach(function(b){ b.textContent = d(b.dataset.k); });
    document.getElementById('q').placeholder = d('search');
    document.querySelectorAll('.wf-lang button').forEach(function(b){ b.classList.toggle('on', b.dataset.l === (EN ? 'en' : 'ko')); });
    document.title = EN ? 'WAFA Phone' : '와파 전화';
  }
  var fmt = function(n){ return n.length <= 4 ? n : n.length <= 7 ? n.slice(0, 4) + '-' + n.slice(4) : n.slice(0, 4) + '-' + n.slice(4, 7) + '-' + n.slice(7); };
  var LET = { 2:'ABC', 3:'DEF', 4:'GHI', 5:'JKL', 6:'MNO', 7:'PQRS', 8:'TUV', 9:'WXYZ' };
  var digits = '', contacts = [];

  /* 번호판 */
  var K = document.getElementById('keys');
  K.innerHTML = ['1','2','3','4','5','6','7','8','9','*','0','#'].map(function(k){
    return '<button type="button" data-n="' + k + '"><b>' + k + '</b><small>' + (LET[k] || '') + '</small></button>'; }).join('');
  K.onclick = function(e){ var b = e.target.closest('[data-n]'); if (sdLong) { sdLong = false; return; } if (b && /\d/.test(b.dataset.n) && digits.length < 10) { digits += b.dataset.n; draw(); } };

  /* ⭐ 2026-11-22 단축다이얼 — 1~9 를 꾸욱(0.6초, 번호를 아직 안 눌렀을 때) = 넣어 둔 와파 번호로 바로 음성 전화
     · 넣어 둔 번호는 이 휴대폰에만 저장(wafa_speed) · 숫자 밑 글자 자리에 이름 · 연락처 칸 위 「⭐ 단축다이얼 1~9」에서 정하고 바꿈
     · 별칭 전화 번호판(alias_phone)의 단축다이얼은 별칭으로 이어진 사람용 — 이것과 따로입니다 */
  var SDK = 'wafa_speed', sdLong = false;
  function sdGet(){ try { var o = JSON.parse(localStorage.getItem(SDK) || '{}'); return o && typeof o === 'object' ? o : {}; } catch (e) { return {}; } }
  function sdPut(o){ try { localStorage.setItem(SDK, JSON.stringify(o)); } catch (e) {} }
  function sdName(x){ if (!x) return ''; var c = contacts.find(function(c){ return c.number === x.n; }); return (c && c.name) || x.w || fmt(x.n); }
  function sdPaint(){
    var S = sdGet();
    K.querySelectorAll('[data-n]').forEach(function(b){ var k = b.dataset.n, sm = b.querySelector('small'); if (!sm || !/[1-9]/.test(k)) return;
      var w = sdName(S[k]); sm.textContent = w ? '🔢 ' + w : (LET[k] || ''); sm.className = w ? 'sd' : ''; });   /* 🔢 번호로 넣은 칸 표시(모든 앱 같게) */
    var box = document.getElementById('sdBox'); if (!box) return;
    box.innerHTML = ['1','2','3','4','5','6','7','8','9'].map(function(k){ var w = sdName(S[k]);
      return '<button type="button" data-s="' + k + '" class="' + (w ? 'on' : '') + '"><b>' + k + '</b><span>' + WF.esc(w ? '🔢 ' + w : d('sdEmpty')) + '</span></button>'; }).join('');
  }
  function sdOpen(n){
    var S = sdGet(), cur = S[n];
    var ov = document.createElement('div'); ov.className = 'sheet';
    ov.innerHTML = '<div><h3>' + WF.esc(d('sdPickT', { n: n })) + '</h3>' +
      (contacts.length ? '<div class="sec" style="margin:0">' + WF.esc(d('sdFromCt')) + '</div><div class="sdPick">' + contacts.map(function(c, i){
        return '<button type="button" data-i="' + i + '">' + WF.esc(c.name || fmt(c.number)) + '<small>' + WF.esc(fmt(c.number)) + '</small></button>'; }).join('') + '</div>' : '') +
      '<div class="sec" style="margin:0">' + WF.esc(d('sdOrNum')) + '</div><div class="sdRow"><input inputmode="numeric" maxlength="13" placeholder="0000-000-000" value="' + (cur ? fmt(cur.n) : '') + '"><button class="btn" type="button" data-ok style="width:auto;padding:0 16px">' + WF.esc(d('sdSave')) + '</button></div>' +
      (cur ? '<button type="button" class="btn" data-clear style="background:transparent;color:var(--sub);border:1.5px solid var(--line)">' + WF.esc(d('sdClear')) + '</button>' : '') +
      '<button type="button" class="btn" data-x style="background:transparent;color:var(--sub)">' + WF.esc(d('sdCancel')) + '</button></div>';
    document.body.appendChild(ov);
    function done(x){ var o = sdGet(); if (x) o[n] = x; else delete o[n]; sdPut(o); ov.remove(); sdPaint(); if (x) msg(d('sdSet', { n: n, w: sdName(x) })); }
    ov.onclick = function(e){
      if (e.target === ov || e.target.closest('[data-x]')) { ov.remove(); return; }
      var b = e.target.closest('[data-i]'); if (b) { var c = contacts[+b.dataset.i]; done({ n: c.number, w: c.name || '' }); return; }
      if (e.target.closest('[data-clear]')) { done(null); return; }
      if (e.target.closest('[data-ok]')) { var v = ov.querySelector('input').value.replace(/\D/g, ''); if (v.length !== 10) { ov.querySelector('input').focus(); ov.querySelector('input').style.borderColor = '#C0392B'; return; } done({ n: v, w: '' }); }
    };
  }
  document.getElementById('sdBox').onclick = function(e){ var b = e.target.closest('[data-s]'); if (b) sdOpen(b.dataset.s); };
  sdPaint();
  K.querySelectorAll('[data-n]').forEach(function(el){
    var k = el.dataset.n, t = null;
    if (!/[1-9]/.test(k)) return;
    el.addEventListener('pointerdown', function(){
      if (digits) return;
      el.classList.add('press');
      t = setTimeout(function(){
        t = null; sdLong = true; el.classList.remove('press');
        try { navigator.vibrate && navigator.vibrate(35); } catch (e) {}
        var x = sdGet()[k];
        if (x && x.n) dial('voice', x.n); else { sdLong = false; msg(d('sdNoSlot', { n: k })); sdOpen(k); }
      }, 600);
    });
    var stop = function(){ if (t) { clearTimeout(t); t = null; } el.classList.remove('press'); };
    el.addEventListener('pointerup', stop); el.addEventListener('pointerleave', stop); el.addEventListener('pointercancel', stop);
    el.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  });
  document.getElementById('del').onclick = function(){ digits = digits.slice(0, -1); draw(); };
  var dt; document.getElementById('del').addEventListener('pointerdown', function(){ dt = setTimeout(function(){ digits = ''; draw(); }, 650); });
  document.getElementById('del').addEventListener('pointerup', function(){ clearTimeout(dt); });

  function draw(){
    document.getElementById('no').textContent = fmt(digits) || ' ';
    document.getElementById('del').style.visibility = digits ? 'visible' : 'hidden';
    var who = document.getElementById('who'), emg = document.getElementById('emg');
    var isEmg = /^(112|119|113|118|122|182|1366)$/.test(digits);
    who.className = 'who' + (isEmg ? ' emg' : '');
    if (isEmg) { who.textContent = d('emg'); emg.hidden = false; emg.href = 'tel:' + digits; emg.textContent = d('emgBtn', { n: digits }); return; }
    emg.hidden = true;
    var hit = digits.length === 10 && contacts.find(function(c){ return c.number === digits; });
    who.innerHTML = !digits ? WF.esc(d('sdHint')) : hit ? '<b>' + WF.esc(hit.name) + '</b>' : digits.length === 10 ? WF.esc(d('unknown')) : digits.length + ' / 10';
    msg('');
  }
  function msg(t, bad, html){ var m = document.getElementById('msg'); m.className = 'msg' + (bad ? ' bad' : ''); if (html) m.innerHTML = html; else m.textContent = t; }

  /* 걸기 — 서버(wafa_dial)가 번호 주인을 찾아 바로 이어 주고(link), 통화 · 대화 화면은 부름 것을 그대로 씁니다 */
  async function dial(kind, number, note){
    number = number || digits;
    if (number.length !== 10) { msg(d('need'), true); return; }
    msg(d('calling'));
    var r;
    try { r = await AL.sb.rpc('wafa_dial', { p_number: number, p_kind: kind, p_note: note || null }); } catch (e) { r = { error: e }; }
    var o = (r && r.data) || {};
    if (r.error || !o.ok) {
      var e = o.error || 'net';
      if (e === 'need_plan' || e === 'need_addon') { msg('', true, WF.esc(d(e === 'need_addon' ? 'e_quota' : 'e_plan')) + ' <a href="wafa_plan.html">' + WF.esc(d('toPlan')) + '</a>'); return; }
      msg(D['e_' + e] ? d('e_' + e) : d('e_net'), true); return;
    }
    if (kind === 'chat') { location.href = 'alias_chat.html?link=' + encodeURIComponent(o.link_id); return; }
    var url = 'alias_call.html?link=' + encodeURIComponent(o.link_id) + '&type=' + kind + '&once=' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    /* 📲 상대가 「항상」 착신전환 — 넘긴 번호로 바로 연결(그 뒤로는 더 넘기지 않음) */
    if (o.fwd_to) { msg(d('fwdTo', { n: fmt(o.fwd_to) })); setTimeout(function(){ location.href = url + '&fw=1'; }, 1200); return; }
    location.href = url;
  }
  D.e_need_plan = D.e_plan;
  document.getElementById('acts').onclick = function(e){
    var b = e.target.closest('[data-k]'); if (!b) return;
    dial(b.dataset.k);
  };

  /* 연락처 — 와파 번호로 이어진 사람 */
  function drawContacts(){
    var q = document.getElementById('q').value.trim().toLowerCase().replace(/-/g, '');
    var L = contacts.filter(function(c){ return !q || (c.name || '').toLowerCase().indexOf(q) >= 0 || (c.number || '').indexOf(q) >= 0; });
    document.getElementById('list').innerHTML = !L.length ? '<div class="empty">' + WF.esc(d('none')) + '</div>' : L.map(function(c, i){
      var av = c.photo ? '<img src="' + WF.esc(c.photo) + '" alt="">' : WF.esc((c.name || '?').slice(0, 1));
      return '<div class="ct"><span class="av">' + av + '</span><div class="tx" data-i="' + i + '"><b>' + WF.esc(c.name || fmt(c.number)) + '</b>' +
        '<span class="n">' + WF.esc(fmt(c.number)) + '</span></div>' +
        '<div class="act"><button data-v="' + i + '" aria-label="video">🎥</button><button class="c" data-c="' + i + '" aria-label="call">📞</button></div></div>'; }).join('');
    document.getElementById('list')._L = L;
  }
  document.getElementById('q').oninput = drawContacts;
  document.getElementById('list').onclick = function(e){
    var L = this._L || [], c = e.target.closest('[data-c]'), v = e.target.closest('[data-v]'), x = e.target.closest('.tx');
    if (c) dial('voice', L[+c.dataset.c].number);
    else if (v) dial('video', L[+v.dataset.v].number);
    else if (x) { digits = L[+x.dataset.i].number; draw(); go(0); }
  };

  /* 📮 음성사서함 — 안 받은 전화에 남긴 음성 메시지(최근 30개). ▶ 바로 듣기 · 💬 대화방 */
  var vms = [], vmAudio = null, VMK = 'wafa_vm_seen';
  function vmSeen(){ try { return localStorage.getItem(VMK) || ''; } catch (e) { return ''; } }
  function vmAgo(t){ var x = new Date(t), now = new Date(), same = x.toDateString() === now.toDateString();
    return same ? x.toLocaleTimeString(EN ? 'en-US' : 'ko-KR', { hour: 'numeric', minute: '2-digit' }) : x.toLocaleDateString(EN ? 'en-US' : 'ko-KR', { month: 'short', day: 'numeric' }); }
  function vmDur(ms){ var s = Math.round((ms || 0) / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
  function drawVm(){
    var box = document.getElementById('vmBox'), seen = vmSeen();
    box.hidden = !vms.length;
    document.getElementById('vmList').innerHTML = vms.map(function(v, i){
      var nm = v.name || (v.number ? fmt(v.number) : '?');
      return '<div class="ct vm' + (v.at > seen ? ' new' : '') + '"><span class="av">📮</span><div class="tx" data-o="' + i + '"><b>' + WF.esc(nm) + '</b>' +
        '<span>' + WF.esc(vmAgo(v.at)) + ' · ' + vmDur(v.ms) + '</span></div>' +
        '<div class="act"><button data-x="' + i + '" aria-label="remove">✕</button><button data-o="' + i + '" aria-label="chat">💬</button><button class="p" data-p="' + i + '" aria-label="play">▶</button></div></div>'; }).join('');
    var n = vms.filter(function(v){ return v.at > seen; }).length, tb = document.querySelector('.ptabs [data-p="1"]');
    n += rcUnseen();
    tb.innerHTML = WF.esc(d('tabRc')) + (n ? '<span class="badge">' + n + '</span>' : '');
  }
  function vmHidden(){ try { return JSON.parse(localStorage.getItem('wafa_vm_hidden') || '[]'); } catch (e) { return []; } }
  function vmHide(v){
    try { var h = vmHidden(); h.push(v.id); localStorage.setItem('wafa_vm_hidden', JSON.stringify(h.slice(-500))); } catch (e) {}
    try { var k = 'al_hidden_' + v.link_id, c = JSON.parse(localStorage.getItem(k) || '[]'); c.push(v.id); localStorage.setItem(k, JSON.stringify(c.slice(-3000))); } catch (e) {}
    if (vmAudio) { try { vmAudio.pause(); } catch (e) {} vmAudio = null; }
  }
  function vmMarkSeen(){ if (vms[0]) { try { localStorage.setItem(VMK, vms[0].at); } catch (e) {} } rcMarkSeen(); }
  document.getElementById('vmList').onclick = async function(e){
    var o = e.target.closest('[data-o]'), pb = e.target.closest('[data-p]'), xb = e.target.closest('[data-x]');
    /* ✕ 들은 음성사서함 지우기 — 이 폰 목록과 그 대화방 화면에서만(보낸 사람 쪽은 그대로) */
    if (xb) { var v = vms[+xb.dataset.x]; vmHide(v); vms.splice(+xb.dataset.x, 1); drawVm(); return; }
    if (o) { location.href = 'alias_chat.html?link=' + encodeURIComponent(vms[+o.dataset.o].link_id); return; }
    if (!pb) return;
    if (vmAudio && vmAudio._b === pb) { vmAudio.pause(); vmAudio = null; pb.textContent = '▶'; return; }
    if (vmAudio) { vmAudio.pause(); vmAudio._b.textContent = '▶'; vmAudio = null; }
    try {
      pb.textContent = '…';
      var a = new Audio(await AL.mediaUrl(vms[+pb.dataset.p].path)); a._b = pb; vmAudio = a;
      a.onended = function(){ pb.textContent = '▶'; if (vmAudio === a) vmAudio = null; };
      await a.play(); pb.textContent = '❚❚';
    } catch (er) { console.warn('[vm] 재생 실패', er); pb.textContent = '▶'; vmAudio = null; }
  };
  async function loadVm(){
    try { var r = await AL.sb.rpc('wafa_voicemails', { p_limit: 30 }); vms = (r && !r.error && r.data) || []; } catch (e) { vms = []; }
    var hid = vmHidden(); vms = vms.filter(function(v){ return hid.indexOf(v.id) < 0; });
    drawVm();
  }

  /* 🕘 최근 기록 — 부름과 같은 통화 기록(my_calls). 줄을 누르면 다시 걸기(와파 번호가 있으면 번호로, 없으면 그 대화방으로) */
  var rcs = [], RCK = 'wafa_rc_seen';
  function rcSeen(){ try { return localStorage.getItem(RCK) || ''; } catch (e) { return ''; } }
  function rcMissed(r){ return !r.outgoing && (r.ended_reason === 'no_answer' || r.ended_reason === 'missed'); }
  function rcUnseen(){ var s0 = rcSeen(); return rcs.filter(function(r){ return rcMissed(r) && r.created_at > s0; }).length; }
  function rcMarkSeen(){ if (rcs[0]) { try { localStorage.setItem(RCK, rcs[0].created_at); } catch (e) {} } }
  function rcNum(r){ for (var i = 0; i < contacts.length; i++) if (contacts[i].link_id === r.link_id) return contacts[i].number; return ''; }
  function rcDir(r){
    var w = r.ended_reason;
    if (w === 'declined') return d(r.outgoing ? 'rcRejOut' : 'rcRejIn');
    if (w === 'no_answer' || w === 'missed') return d(r.outgoing ? 'rcNoAns' : 'rcMissed');
    return d(r.outgoing ? 'rcOut' : 'rcIn');
  }
  function drawRc(){
    var box = document.getElementById('rcList');
    if (!rcs.length) { box.innerHTML = '<div class="empty">' + WF.esc(d('rcNone')) + '</div>'; return; }
    box.innerHTML = rcs.map(function(r, i){
      var num = rcNum(r), nm = r.peer_label || r.peer_display || (num ? fmt(num) : '?'), miss = rcMissed(r);
      var icon = r.outgoing ? '↗' : (miss ? '↙' : '↙');
      var dur = r.duration_seconds ? ' · ' + Math.floor(r.duration_seconds / 60) + ':' + String(r.duration_seconds % 60).padStart(2, '0') : '';
      var vid = r.call_type === 'video' ? ' · 🎥' : '';
      return '<div class="ct rc"><span class="av">' + (r.call_type === 'video' ? '🎥' : '📞') + '</span>' +
        '<div class="tx" data-r="' + i + '"><b class="' + (miss ? 'miss' : '') + '">' + WF.esc(nm) + '</b>' +
        '<span><span class="dir' + (miss ? ' miss' : '') + '">' + icon + ' ' + WF.esc(rcDir(r)) + '</span>' + dur +
        (num && (r.peer_label || r.peer_display) ? ' · ' + WF.esc(fmt(num)) : '') + '</span></div>' +
        '<div class="act"><span class="t">' + WF.esc(vmAgo(r.created_at)) + '</span>' +
        '<button class="c" data-rv="' + i + '" aria-label="call">📞</button></div></div>'; }).join('');
  }
  function rcCall(r, kind){
    var num = rcNum(r);
    if (num) { dial(kind, num); return; }
    location.href = 'alias_call.html?link=' + encodeURIComponent(r.link_id) + '&type=' + kind + '&once=' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }
  document.getElementById('rcList').onclick = function(e){
    var b = e.target.closest('[data-rv]'), x = e.target.closest('[data-r]');
    if (b) { rcCall(rcs[+b.dataset.rv], 'voice'); return; }
    if (x) { var r = rcs[+x.dataset.r], num = rcNum(r);
      if (num) { digits = num; draw(); go(0); } else location.href = 'alias_chat.html?link=' + encodeURIComponent(r.link_id); }
  };
  async function loadRc(){
    try { var r = await AL.sb.rpc('my_calls', { p_limit: 60 }); rcs = (r && !r.error && r.data) || []; } catch (e) { rcs = []; }
    rcs.sort(function(a, b){ return a.created_at < b.created_at ? 1 : -1; });
    drawRc(); drawVm();
  }

  /* 두 화면 */
  var pages = document.getElementById('pages');
  function mark(i){ document.querySelectorAll('.ptabs button').forEach(function(b){ b.classList.toggle('on', +b.dataset.p === i); });
    if (i === 1 && (vms.length || rcUnseen())) { setTimeout(function(){ vmMarkSeen(); var tb = document.querySelector('.ptabs [data-p="1"] .badge'); if (tb) tb.remove(); }, 1500); } }
  function go(i){ pages.scrollTo({ left: i * pages.clientWidth, behavior: 'smooth' }); mark(i); }
  document.querySelector('.ptabs').onclick = function(e){ var b = e.target.closest('[data-p]'); if (b) go(+b.dataset.p); };
  pages.addEventListener('scroll', function(){ mark(Math.round(pages.scrollLeft / pages.clientWidth)); }, { passive: true });

  /* 위 · 아래 */
  function net(){ var on = navigator.onLine !== false; document.getElementById('strip').classList.toggle('off', !on); document.getElementById('stripTx').textContent = d(on ? 'wifiOn' : 'wifiOff'); }
  window.addEventListener('online', net); window.addEventListener('offline', net);
  document.getElementById('help').onclick = function(){ document.getElementById('helpList').innerHTML = D.help[EN ? 1 : 0].map(function(h){ return '<li>' + WF.esc(h) + '</li>'; }).join(''); document.getElementById('sheet').hidden = false; };
  document.getElementById('helpOk').onclick = function(){ document.getElementById('sheet').hidden = true; };
  document.querySelector('.wf-lang').onclick = function(e){ var b = e.target.closest('[data-l]'); if (!b) return; try { localStorage.setItem('alias_lang_v1', b.dataset.l === 'en' ? 'en' : 'kr'); } catch (er) {} location.reload(); };

  paintText(); mark(0); net(); draw();
  /* ☎ 2026-11-22 다이얼 첫 화면에서 왔을 때 — #recent · #contacts 로 그 칸을 바로 · 아래 [설정] 자리를 [☎ 다이얼 홈] 으로 */
  (function(){
    var h = location.hash, i = h === '#recent' ? 1 : h === '#contacts' ? 2 : -1;
    if (i > 0) setTimeout(function(){ pages.scrollTo({ left: i * pages.clientWidth }); mark(i); }, 60);
    if (window.WAFA_HOME === 'dial') { var a = document.querySelector('.bottom a[href="wafa_start.html?home=1"]');
      if (a) { a.href = 'wafa_home_dial.html'; a.innerHTML = '<i>☎</i><span>' + (EN ? 'Dial home' : '다이얼 홈') + '</span>'; } }
  })();
  WF.themeBtn(document.getElementById('themeHost'));
  WF.logoutBtn(document.getElementById('logoutHost'));
  document.querySelector('#getNum b').textContent = WF.t('getNumBtn');
  document.querySelector('#getNum span').textContent = WF.t('getNumSub');

  /* 번호판 모양 · 소리 (부름 · 가림콜과 같은 padstyle.js) */
  var cs = getComputedStyle(document.documentElement);
  var PS = PadStyle.attach({
    key: 'wafa_padstyle', watch: document.getElementById('panel'), holdMs: 600,
    digits: function(){ var o = {}; K.querySelectorAll('[data-n]').forEach(function(b){ if (/\d/.test(b.dataset.n)) o[b.dataset.n] = b; }); return o; },
    extraKeys: function(el){ var b = el.closest('#keys [data-n]'); return b ? b.dataset.n : null; },
    bar: function(){ return { parent: document.getElementById('padBar') }; },
    rotaryAt: function(){ return { parent: document.getElementById('panel'), before: document.getElementById('emg') }; },
    hide: function(){ return [K]; },
    center: function(){ var t = document.getElementById('myNo').textContent || ''; return ['WAFA', t === '—' ? '' : t, 'Wi-Fi Phone']; },
    colors: { plate:'#0F6E68', rim:'#0A4F4A', base:'#F6F1E4', ink:'#1B2430', stop:'#B9BEC4', on: cs.getPropertyValue('--brand').trim() || '#0F6E68', onInk: cs.getPropertyValue('--brand-ink').trim() || '#fff' },
    defaults: { mode:'square', key:'dtmf', rot:true },
    lang: function(){ return EN ? 'en' : 'ko'; },
    text: { ko: { snd:'🔊', sndOff:'🔇', hold:' · 1~9 꾸욱 = 단축다이얼' }, en: { snd:'🔊', sndOff:'🔇', hold:' · hold 1–9 = speed dial' } }
  });

  /* 🔴 2026-11-21 다이얼이 화면 아래로 잘리지 않게 — 번호판 화면에 다 들어가도록 다이얼 크기를 줄임(최소 210px) */
  var PG = document.querySelector('#pages .page'), PN = document.getElementById('panel'), fitT = 0;
  function fitDial(){
    fitT = 0;
    var sv = PN.querySelector('.ps-rot svg');
    PN.style.removeProperty('--ps-size');
    if (!sv || !PG.clientHeight) return;
    var over = PG.scrollHeight - PG.clientHeight;
    if (over > 0) PN.style.setProperty('--ps-size', Math.max(210, Math.floor(sv.getBoundingClientRect().width - over - 2)) + 'px');
  }
  function fitSoon(){ if (!fitT) fitT = requestAnimationFrame(fitDial); }
  try { new MutationObserver(fitSoon).observe(PN, { childList: true, subtree: true }); } catch (e) {}
  try { new ResizeObserver(fitSoon).observe(document.getElementById('pages')); } catch (e) {}
  window.addEventListener('resize', fitSoon); fitSoon();

  /* 로그인 · 내 번호 · 연락처 */
  var sess = await AL.requireLogin(); if (!sess) return;
  try {
    var me = await WF.me();
    if (me && me.setup === false) { location.replace('wafa_start.html'); return; }
    var n = me && me.numbers && me.numbers[0];
    document.getElementById('myNo').textContent = n ? fmt(n.number) : '—';
    /* 🔴 2026-11-20 번호가 없으면 [내 번호] 자리에 [내 번호 받기] 단추 */
    document.getElementById('mineBox').hidden = !n; document.getElementById('getNum').hidden = !!n;
    PS.repaint();
  } catch (e) {}
  try { var r = await AL.sb.rpc('wafa_contacts'); contacts = (r && r.data) || []; } catch (e) { contacts = []; }
  sdPaint();
  drawContacts(); draw(); loadVm(); loadRc();
  /* 다른 화면(통화)에서 돌아오면 새로 */
  window.addEventListener('pageshow', function(ev){ if (ev.persisted) { loadRc(); loadVm(); } });
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) { loadRc(); loadVm(); } });
  var q0 = new URLSearchParams(location.search).get('n'); if (q0 && /^\d{10}$/.test(q0)) { digits = q0; draw(); }
})();
</script>
</body>
</html>
