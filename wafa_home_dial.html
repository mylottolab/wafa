<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>와파 WAFA</title>
<meta name="theme-color" content="#0F6E68">
<link rel="stylesheet" href="wafa.css?v=20261120c">
<script src="alias_config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="alias_common.js?v=20261123b"></script>
<script src="wafa.js?v=20261121c"></script>
<script src="dialhome.js?v=20261123c"></script>
<script src="wafa_home_mode.js?v=20261122b"></script>
<style>
/* ☎ 와파 다이얼 첫 화면 (2026-11-22 채택) — 다이얼 모양 · 돌리기는 dialhome.js(와파 · 부름 · 누름 · 바로너 공용)
   예전 첫 화면(wafa_dial.html: 번호판 · 최근 · 연락처)이 하던 일을 여기서도:
     인터넷 연결 표시 · 내 번호(가운데) · 번호 없으면 받기 안내 · 새 음성사서함 · 부재중 배지(2번) · 112 · 119 안내 · 로그아웃(⚙ 전체 메뉴) */
.wf{gap:10px}
.strip{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);background:var(--chip);border-radius:12px;padding:7px 12px}
.strip .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:0 0 auto}
.strip.off{background:#FDECEA;color:#9B2C12}.strip.off .dot{background:#D93025}
.done-msg{background:var(--soft);border:1.5px solid var(--brand);border-radius:14px;padding:12px 14px;font-size:14.5px;font-weight:700;text-align:center}
.setup{background:var(--soft);border-radius:14px;padding:12px 14px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.setup ol{margin:0;padding-left:20px}.setup li.done{color:var(--sub);text-decoration:line-through}
.sos{font-size:12px;color:var(--sub);text-align:center;margin:0}
.foot{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;font-size:13px}
.foot a,.foot button{color:var(--sub);background:none;border:0;font:inherit;text-decoration:underline;cursor:pointer;padding:6px 2px}
.trybar{background:var(--chip);border-radius:12px;padding:8px 12px;font-size:12.5px;color:var(--sub);text-align:center}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wf">
  <div class="wf-top"></div>
  <div id="trybar" class="trybar" hidden></div>
  <div class="strip" id="strip"><span class="dot"></span><span id="stripTx"></span></div>
  <div class="done-msg" id="doneMsg" hidden></div>
  <div id="dial"></div>
  <div class="setup" id="setup" hidden></div>
  <p class="sos" id="sos"></p>
  <div class="foot">
    <a href="wafa_start.html?home=1" id="fAll"></a>
  </div>
</div>

<script>
(async function(){
  'use strict';
  var EN = !!WF.en;
  var T = function(ko, en){ return EN ? en : ko; };

  /* ── 이 폰만 시험(?try=1) ── */
  try { if (/[?&]try=1/.test(location.search)) { localStorage.setItem('wafa_home_mode', 'dial'); history.replaceState(null, '', 'wafa_home_dial.html'); } } catch (e) {}

  WF.header(null, null);

  /* 인터넷 연결 (예전 첫 화면과 같은 문구) */
  function net(){ var on = navigator.onLine !== false; document.getElementById('strip').classList.toggle('off', !on);
    document.getElementById('stripTx').textContent = on ? T('인터넷 연결됨 · 전화를 걸고 받을 수 있어요', 'Online · you can call and answer')
                                                       : T('인터넷이 끊겼어요 · 와이파이나 핫스팟을 켜 주세요', 'No internet · turn on Wi-Fi or a hotspot'); }
  window.addEventListener('online', net); window.addEventListener('offline', net); net();
  document.getElementById('sos').textContent = T('와파 번호로는 112 · 119 같은 긴급전화가 걸리지 않습니다. 휴대폰 기본 전화로 거세요.', 'WAFA numbers cannot reach 112 · 119. Use your phone’s own dialer.');

  /* 로그인 — 앱이 막 깨어날 때 저장소에서 꺼내는 데 잠깐 걸려서 2초 동안 다시 물어봄(AL.requireLogin 과 같은 까닭) */
  var sess = (await AL.sb.auth.getSession()).data.session;
  for (var i = 0; !sess && i < 8; i++) { await new Promise(function(r){ setTimeout(r, 250); }); sess = (await AL.sb.auth.getSession()).data.session; }
  if (!sess) { location.replace('wafa_start.html'); return; }
  var me = null;
  try { me = await WF.me(); } catch (e) {}
  if (me && me.setup === false) { location.replace('wafa_start.html'); return; }

  var hasNum = !!(me && me.numbers && me.numbers.length);
  var s = me && me.sub;
  var hasPlan = !!(s && s.status !== 'expired' && s.status !== 'refunded' && new Date(s.until) > new Date());
  var NEXT = !hasNum ? '4' : !hasPlan ? '7' : null;

  var PIC6 = '<svg viewBox="0 0 320 70" role="img" aria-label="' + T('착신전환 그림', 'Forwarding diagram') + '">' +
    '<g font-family="system-ui" font-size="11" fill="currentColor" text-anchor="middle">' +
    '<rect x="6" y="18" width="62" height="34" rx="8" fill="none" stroke="currentColor"/><text x="37" y="39">' + T('거는 사람', 'Caller') + '</text>' +
    '<line x1="70" y1="35" x2="116" y2="35" stroke="currentColor" stroke-width="2"/><path d="M116 31 L122 35 L116 39z" fill="currentColor"/>' +
    '<rect x="122" y="18" width="76" height="34" rx="8" fill="none" stroke="currentColor"/><text x="160" y="33">' + T('내 와파', 'My WAFA') + '</text><text x="160" y="46">' + T('(못 받음)', '(missed)') + '</text>' +
    '<line x1="200" y1="35" x2="244" y2="35" stroke="currentColor" stroke-width="2" stroke-dasharray="4 3"/><path d="M244 31 L250 35 L244 39z" fill="currentColor"/>' +
    '<rect x="250" y="18" width="64" height="34" rx="8" fill="none" stroke="currentColor"/><text x="282" y="33">' + T('돌려받을', 'Forward') + '</text><text x="282" y="46">' + T('번호', 'number') + '</text></g></svg>';

  /* ── 번호마다 하는 일 ── */
  function items(badge2){ return {
    '1': { ico:'☎️', t:T('전화 걸기', 'Call'), d:T('번호를 눌러 음성 · 영상 · 문자', 'Dial a number — voice, video, text'), url:'wafa_dial.html#pad',
           info:T('와파 번호를 눌러 전화합니다. 와이파이가 없어도 데이터로 걸리고, 해외에서도 와파끼리는 로밍 없이 통화됩니다.', 'Call a WAFA number. Works on mobile data without Wi-Fi, and WAFA-to-WAFA calls need no roaming abroad.'),
           steps:[T('와파 번호 10자리를 누르세요', 'Enter a 10-digit WAFA number'), T('음성 · 영상 · 문자 중 하나를 누르세요', 'Tap voice, video or text'), T('끝나면 빨간 버튼으로 끊습니다', 'Tap the red button to hang up')] },
    '2': { ico:'🕘', t:T('최근 기록', 'Recents'), d:T('걸고 받은 전화 · 음성사서함', 'Calls and voicemail'), url:'wafa_dial.html#recent', badge:badge2,
           info:T('걸고 받은 전화, 부재중 전화, 음성사서함을 봅니다.', 'Calls you made and got, missed calls and voicemail.'),
           steps:[T('맨 위 📮 음성사서함은 ▶ 로 들어요', 'Play voicemail at the top with ▶'), T('기록에서 사람을 고르면 번호가 번호판에 들어갑니다', 'Pick a call to put the number on the keypad'), T('음성 · 영상 · 문자 중 하나를 누르세요', 'Tap voice, video or text')] },
    '3': { ico:'👥', t:T('연락처', 'Contacts'), d:T('저장한 사람 · 단축다이얼', 'Saved people, speed dial'), url:'wafa_dial.html#contacts',
           info:T('저장한 연락처를 보고, 자주 거는 분은 맨 위 「⭐ 단축다이얼 1~9」에 넣어 둡니다.', 'Your saved contacts — put frequent ones in “⭐ Speed dial 1–9” at the top.'),
           steps:[T('이름으로 찾거나 목록에서 고르세요', 'Search or pick a contact'), T('번호가 번호판에 바로 들어갑니다', 'Their number goes onto the keypad'), T('번호판에서 그 숫자를 꾸욱 = 바로 전화', 'Hold that number on the keypad to call')] },
    '4': { ico:'🔢', t:T('내 와파 번호', 'My number'), d:hasNum ? T('번호 보기 · 바꾸기 · 좋은 번호', 'View, change, premium numbers') : T('처음이면 여기서 번호 받기', 'Get your number here first'), url:'wafa_number.html', need:!hasNum,
           info:T('와파 전화번호를 받거나 바꿉니다. 유심 · 통신사 가입이 없어도 이 번호로 전화를 걸고 받습니다.', 'Get or change your WAFA number. No SIM or carrier plan needed.'),
           steps:[T('받고 싶은 번호를 고르세요', 'Choose a number'), T('★ 좋은 번호는 따로 결제, 일반 번호는 이용권으로 받습니다', '★ Premium numbers are paid; regular ones come with a plan'), T('받는 즉시 그 번호로 걸고 받을 수 있어요', 'Call and receive on it right away')] },
    '5': { ico:'💬', t:T('별칭 전화', 'Alias calls'), d:T('번호 대신 별칭으로 연결', 'Connect by alias, not number'),
           go:function(){ try { sessionStorage.setItem('wafa_pl', String(Date.now())); } catch (e) {} location.href = 'alias_contacts.html'; },
           info:T('내 번호를 알려 주지 않고 별칭(닉네임)으로 통화 · 대화합니다. 상대가 수락해야 이어집니다.', 'Talk by nickname without sharing your number. Connects after the other side accepts.'),
           steps:[T('내 별칭(닉네임)을 정하세요', 'Set your nickname'), T('상대에게 초대를 보내거나 연결을 요청하세요', 'Send an invite or a connect request'), T('수락되면 번호 없이 전화 · 대화합니다', 'Once accepted, call and chat without numbers')] },
    '6': { ico:'📲', t:T('통화 설정', 'Call settings'), d:T('벨 · 착신전환 · 음성사서함', 'Ring, forwarding, voicemail'), url:'wafa_callset.html', pic:PIC6,
           info:T('벨소리, 다른 번호로 돌려받기(착신전환), 음성사서함을 정합니다.', 'Set ringtone, call forwarding and voicemail.'),
           steps:[T('벨소리를 고르세요', 'Pick a ringtone'), T('못 받을 때 돌려받을 번호를 정하세요 (착신전환)', 'Set a number to forward to when you miss calls'), T('음성사서함을 켜 두면 메시지를 남겨 줍니다', 'Turn on voicemail to get messages')] },
    '7': { ico:'💳', t:T('이용권', 'Plan'), d:hasPlan ? WF.subLine(me) : T('구독하고 전화 걸기', 'Subscribe to make calls'), url:'wafa_plan.html', need:hasNum && !hasPlan,
           info:T('전화 걸기는 이용권(구독)이 있어야 합니다. 문자는 무료예요. 보충권 · 해지 · 변경도 여기서.', 'Calling needs a plan; texting is free. Add-ons, change or cancel here.'),
           steps:[T('1 · 3 · 6 · 12개월 중 고르세요', 'Pick 1, 3, 6 or 12 months'), T('구글 · 애플 결제창에서 결제합니다', 'Pay in the Google / Apple sheet'), T('해지 · 변경은 이 화면 또는 스토어 구독 관리에서', 'Cancel or change here or in store subscriptions')] },
    '8': { ico:'📊', t:T('사용량', 'Usage'), d:T('이번 달 통화 · 문자 · 저장', 'This month: calls, texts, storage'), url:'wafa_usage.html',
           info:T('이번 달에 쓴 통화 시간 · 문자 · 저장 공간을 봅니다.', 'Minutes, texts and storage used this month.'),
           steps:[T('이번 달 통화 시간 · 문자 · 저장을 봅니다', 'See this month\'s minutes, texts, storage'), T('모자라면 보충권으로 더합니다', 'Top up with an add-on if needed'), T('날짜별로 얼마나 썼는지 확인합니다', 'Check usage by day')] },
    '9': { ico:'📘', t:T('사용법', 'How to use'), d:T('전체 기능 소개 · PDF', 'All features · PDF'), url:'features.html',
           info:T('와파의 모든 기능을 차례로 봅니다. PDF로 내려받을 수도 있습니다.', 'A tour of every feature, with a PDF download.'),
           steps:[T('기능을 차례로 넘겨 봅니다', 'Flip through each feature'), T('PDF로 내려받아 두고 볼 수 있어요', 'Download it as a PDF'), T('그래도 모르면 0번 고객센터', 'Still stuck? Dial 0')] },
    '0': { ico:'🙋', t:T('고객센터', 'Help desk'), d:T('묻고 답 받기', 'Ask us anything'), url:'support.html',
           info:T('궁금한 점이나 불편한 점을 남기면 답을 드립니다. (옛날 전화의 0번 = 교환원)', 'Leave a question and we will reply. (0 = operator, like old phones)'),
           steps:[T('궁금한 점이나 불편한 점을 적으세요', 'Write your question'), T('보내기를 누르세요', 'Tap send'), T('답이 오면 알림으로 알려 드립니다', 'We will notify you when we reply')] }
  }; }
  function hintText(){ return !hasNum ? T('처음이세요? 4번을 돌려 와파 번호부터 받으세요', 'New here? Dial 4 to get your WAFA number')
    : !hasPlan ? T('7번을 돌리면 이용권을 고를 수 있어요 (문자는 무료)', 'Dial 7 to choose a plan (texting is free)')
    : T('숫자를 톡 누르면 안내 · 멈춤쇠까지 돌리면 바로 실행', 'Tap a number for info · dial it to the stop to open'); }

  var dh = DialHome.mount(document.getElementById('dial'), {
    en: EN, key: 'wafa', brand: { plate: WF.isDark() ? '#1C8A82' : '#0F6E68', rim: '#0B524D', ring: '#0A4743', ink: '#FFFFFF' },
    center: function(){ return { title: 'WAFA', sub: hasNum ? WF.shown(me.numbers[0].number) : T('번호 없음', 'No number yet') }; },
    hint: hintText(), next: NEXT, items: items(0),
    centerTap: { label: T('톡 = 전화 걸기', 'Tap = Call'), go: function(){ location.href = 'wafa_dial.html#pad'; } },
    firstScreen: function(){ try { localStorage.setItem('wafa_home_mode', 'classic'); } catch (e) {} location.replace('wafa_dial.html'); }
  });

  /* ── 새 음성사서함 · 부재중 → 2번 배지 (예전 첫 화면 [최근] 칸 배지와 같은 계산) ── */
  (async function(){
    var n = 0;
    try {
      var hid = []; try { hid = JSON.parse(localStorage.getItem('wafa_vm_hidden') || '[]'); } catch (e) {}
      var vs = localStorage.getItem('wafa_vm_seen') || '', rs = localStorage.getItem('wafa_rc_seen') || '';
      var v = await AL.sb.rpc('wafa_voicemails', { p_limit: 30 });
      n += ((v && !v.error && v.data) || []).filter(function(x){ return hid.indexOf(x.id) < 0 && x.at > vs; }).length;
      var c = await AL.sb.rpc('my_calls', { p_limit: 60 });
      n += ((c && !c.error && c.data) || []).filter(function(r){ return !r.outgoing && (r.ended_reason === 'no_answer' || r.ended_reason === 'missed') && r.created_at > rs; }).length;
    } catch (e) {}
    if (n) dh.update({ items: items(n) });
  })();

  /* ── 처음 설정 · 다 하고 돌아왔을 때 ── */
  if (!hasNum || !hasPlan) {
    var st = document.getElementById('setup'); st.hidden = false; dh.mid.appendChild(st);   // 번호 목록 위에
    st.innerHTML = '<b>' + WF.esc(T('처음 설정 — 다이얼로 차례대로', 'First-time setup — dial in order')) + '</b><ol>' +
      '<li class="done">' + WF.esc(T('가입 · 로그인', 'Sign up / log in')) + '</li>' +
      '<li class="' + (hasNum ? 'done' : '') + '">' + WF.esc(T('4번 — 내 와파 번호 받기', '4 — Get your WAFA number')) + '</li>' +
      '<li class="' + (hasPlan ? 'done' : '') + '">' + WF.esc(T('7번 — 이용권 고르기 (전화 걸기용 · 문자는 무료)', '7 — Choose a plan (for calls · texts are free)')) + '</li>' +
      '<li>' + WF.esc(T('6번 — 벨 · 착신전환 정하기 (선택)', '6 — Ring & forwarding (optional)')) + '</li></ol>';
  }
  try {
    var prev = JSON.parse(sessionStorage.getItem('wafa_dh_state') || 'null'), dm = document.getElementById('doneMsg');
    if (prev && !prev.n && hasNum) { dm.hidden = false; dm.textContent = T('✓ 번호 받기 완료! ', '✓ Number ready! ') + (NEXT === '7' ? T('다음은 7번 — 이용권 고르기', 'Next: dial 7 to choose a plan') : T('이제 1번으로 전화를 걸어 보세요', 'Now dial 1 to make a call')); }
    else if (prev && !prev.p && hasPlan) { dm.hidden = false; dm.textContent = T('✓ 이용권 준비 완료! 이제 1번으로 전화를 걸어 보세요', '✓ Plan ready! Now dial 1 to make a call'); }
    sessionStorage.setItem('wafa_dh_state', JSON.stringify({ n: hasNum, p: hasPlan }));
  } catch (e) {}

  /* ── 아래 줄 ── */
  document.getElementById('fAll').textContent = T('⚙ 전체 메뉴 · 로그아웃', '⚙ All menus · Log out');
  try { if (localStorage.getItem('wafa_home_mode') === 'dial' && (window.WAFA_HOME_ALL || 'classic') !== 'dial') {
    var tb = document.getElementById('trybar'); tb.hidden = false; tb.textContent = T('시험 중 — 이 폰만 다이얼 첫 화면입니다', 'Preview — dial home on this phone only'); } } catch (e) {}
  WF.legal(document.querySelector('.wf'));
})();
</script>
<script src="whatsnew.js?v=20261123a" data-app="wafa" data-after=".wf-top" defer></script>
</body>
</html>
